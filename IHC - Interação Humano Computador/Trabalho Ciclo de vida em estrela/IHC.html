<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciclo de Vida em Estrela - Simulação IHC</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23005b3f'/><text x='50' y='50' font-family='sans-serif' font-weight='bold' font-size='36' fill='%23ffffff' dominant-baseline='central' text-anchor='middle'>IHC</text></svg>">
  <link rel="stylesheet" href="IHC.css">
</head>

<body>

  <!-- Cabeçalho / Faixa Superior -->
  <header class="top-bar">
    <button id="report-btn" class="report-btn hidden" onclick="openModal()" aria-label="Avaliação / Relatar problema">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      Relatar problema
    </button>
  </header>

  <!-- Área Central -->
  <main class="main-container">
    <div id="card" class="card card-fade-in">
      <!-- O conteúdo será injetado aqui via JavaScript -->
    </div>
  </main>

  <!-- Modal / Pop-up -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button class="close-btn" onclick="closeModal()" aria-label="Fechar modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="modal-body">
        <!-- O conteúdo do modal será injetado aqui via JavaScript -->
      </div>
    </div>
  </div>

  <script src="IHC.js"></script>

  <!-- Footer -->
  <footer class="site-footer">
    <p>Feito com <span class="heart">❤</span> por <a href="https://hertonnn.github.io/" target="_blank"
        rel="noopener noreferrer">Herton Silveira</a></p>
    <p class="copyright">Todos os direitos reservados</p>
  </footer>
</body>

</html>
